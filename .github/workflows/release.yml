name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BINARY: kat

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build all targets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          commit="$(git rev-parse --short HEAD)"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X main.version=${VERSION} -X main.commit=${commit} -X main.date=${date}"

          targets="
          linux/amd64
          linux/arm64
          darwin/amd64
          darwin/arm64
          windows/amd64
          windows/arm64
          "

          for target in $targets; do
            goos="${target%/*}"
            goarch="${target#*/}"
            outdir="build/${goos}_${goarch}"
            binary="${BINARY}"
            [ "$goos" = "windows" ] && binary="${BINARY}.exe"

            echo "==> building ${goos}/${goarch}"
            mkdir -p "$outdir"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "$ldflags" -o "${outdir}/${binary}" ./cmd

            cp Readme.md "$outdir/" 2>/dev/null || true
            cp LICENSE "$outdir/" 2>/dev/null || true

            archive="${BINARY}_${VERSION}_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then
              (cd "$outdir" && zip -qr "../../dist/${archive}.zip" .)
            else
              tar -czf "dist/${archive}.tar.gz" -C "$outdir" .
            fi
          done

          (cd dist && sha256sum * > checksums.txt)
          ls -lh dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" dist/* \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag
